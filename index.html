<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>Cadastro de Clientes</h1>
  <p class="subtitulo">Preencha os dados abaixo</p>

  <form>

    <h2>Dados pessoais</h2>

    <div class="campo">
      <label for="nome">Nome completo</label>
      <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
    </div>

    <div class="coluna">
      <div class="campo">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00">
      </div>
      <div class="campo">
        <label for="nascimento">Nascimento</label>
        <input type="date" id="nascimento" name="nascimento">
      </div>
    </div>

    <h2>Contato</h2>

    <div class="campo">
      <label for="celular">Celular / WhatsApp</label>
      <input type="tel" id="celular" name="celular" placeholder="(00) 00000-0000">
    </div>

    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="nome@exemplo.com">
    </div>

    <h2>Endereço</h2>

    <div class="coluna">
      <div class="campo">
        <label for="cep">CEP</label>
        <input type="text" id="cep" name="cep" placeholder="00000-000">
      </div>
      <div class="campo">
        <label for="numero">Número</label>
        <input type="text" id="numero" name="numero" placeholder="Nº">
      </div>
    </div>

    <div class="campo">
      <label for="rua">Rua</label>
      <input type="text" id="rua" name="rua" placeholder="Nome da rua">
    </div>

    <div class="coluna">
      <div class="campo">
        <label for="bairro">Bairro</label>
        <input type="text" id="bairro" name="bairro">
      </div>

      <div class="campo">
        <label for="cidade">Cidade</label>
        <input type="text" id="cidade" name="cidade">
      </div>
    </div>



    <div class="campo-checkbox">
       
        <input type="checkbox" id="aceite" name="aceite">
        <label for="aceite" ">Autorizo o uso destes dados para contato</label>
    </div>

    <button type="submit">Cadastrar cliente</button>

  </form>

</div>

</body>
</html>
