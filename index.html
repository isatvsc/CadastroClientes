<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Cadastro</a></li>
                <br>
                <li><a href="#">Login</a></li>
            </ul>
        </nav>

    </header>
    <h1>Cadastro de Clientes</h1>
    
    <form>

        <label for ="nome">Nome:</label>
        <input type="text" id ="nome" name ="nome" placeholder ="Digite seu nome completo" required>    
        <br><br>

        <label for ="usuario">Nome de Usuário:</label>
        <input type ="text" id ="usuario" name ="usuario" placeholder ="Digite seu nome de usuário" required>
        <br><br>

        <label for ="email">E-mail:</label>
        <input type ="email" id ="email" name ="email" placeholder ="Digite seu e-mail" required>
        <br><br>

        <label for ="senha">Senha:</label>
        <input type ="password" id ="senha" name ="senha" placeholder ="Digite sua senha" required>
        <br><br>

        <label for ="confirmaçao">Confirme sua Senha:</label>
        <input type = "password" id = "confirmaçao" name = "confirmaçao" placeholder = "Confirme sua senha" required>
        <br><br>

        <input type="checkbox" id="termos" name="termos" required>
        <label for="termos">Li e aceito os termos de uso</label>
        <br><br>

        <input type="submit" value="Cadastrar">

        
    </form>

    

</body>
</html>
